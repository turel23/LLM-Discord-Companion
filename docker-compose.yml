version: '3.8'

services:
  zep:
    image: ghcr.io/getzep/zep:latest
    ports:
      - "8000:8000"
    environment:
      ZEP_STORE_TYPE: "postgres"
      ZEP_STORE_POSTGRES_CONNECTIONSTRING: "postgresql://zep:zep@postgres:5432/zep"
      ZEP_OPENAI_API_KEY: "sk-dummy"
      ZEP_LLM_PROVIDER: "custom"
      ZEP_LLM_CUSTOM_SERVER_URL: "http://host.docker.internal:1234/v1"
      ZEP_EMBEDDING_PROVIDER: "custom"
      ZEP_EMBEDDING_CUSTOM_SERVER_URL: "http://host.docker.internal:1235/v1"
    depends_on:
      - postgres
    networks:
      - zep-net

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=zep
      - POSTGRES_PASSWORD=zep
      - POSTGRES_DB=zep
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - zep-net

volumes:
  postgres_data:

networks:
  zep-net:
